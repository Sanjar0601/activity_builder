<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Submitted</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 40px;
        }
        .results-card {
            max-width: 600px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card shadow-sm results-card">
            <div class="card-body text-center">
                <i class="bi bi-check-circle-fill text-success display-4"></i>
                <h1 class="mt-3">Thank you, {{ student_name }}!</h1>
                <p class="lead mb-1">Your Score: <strong>{{ score }}/{{ total_questions }}</strong></p>
                <p class="text-success">Status: Successfully Submitted</p>
                <a href="/" class="btn btn-primary mt-3">
                    <i class="bi bi-house"></i> Return to Home
                </a>
            </div>
        </div>
    </div>

    <script>
        if (document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement) {
            document.exitFullscreen?.();
        }
    </script>
</body>
</html>
